<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="Arial, sans-serif">
  <rect width="760" height="200" rx="14" fill="#f4f5ff"/>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="24" y="50" width="200" height="100" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="124" y="82" fill="#166534">1. Mounting</text>
    <text x="124" y="106" font-weight="400" fill="#475569">constructor → render</text><text x="124" y="126" font-weight="400" fill="#475569">componentDidMount</text>
    <rect x="280" y="50" width="200" height="100" rx="12" fill="#fff" stroke="#d97706" stroke-width="2"/>
    <text x="380" y="82" fill="#92400e">2. Updating</text>
    <text x="380" y="106" font-weight="400" fill="#475569">props / state change</text><text x="380" y="126" font-weight="400" fill="#475569">render → componentDidUpdate</text>
    <rect x="536" y="50" width="200" height="100" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/>
    <text x="636" y="82" fill="#991b1b">3. Unmounting</text>
